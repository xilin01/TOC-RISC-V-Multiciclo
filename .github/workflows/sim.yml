   name: Simulación

   on: [push, pull_request]

   jobs:
     ghdl:
       runs-on: ubuntu-24.04
       strategy:
         matrix:
           variante: [j, lsw, mv]
       steps:
         - uses: actions/checkout@v4
         - name: Instalar GHDL
           run: sudo apt-get update && sudo apt-get install -y ghdl
         - name: Simular variante ${{ matrix.variante }}
           run: bash sim/run_sim.sh ${{ matrix.variante }}